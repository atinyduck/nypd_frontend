<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NYPD Citation System - Driver Login</title>
        <link rel="stylesheet" href="../css/styles.css">
    </head>

    <body>
        <!-- NAVIGATION BAR (same as homepage) -->
    <nav class="navbar">
      <div class="container">
        <div class="logo">
          <h1>NYPD Citation System</h1>
        </div>
        
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="driver-login.html" class="active">Driver Login</a></li>
          <li><a href="admin-login.html">Admin Login</a></li>
        </ul>
      </div>
    </nav>

    <!-- MAIN LOGIN CONTAINER -->
    <main class="login-main">
      <div class="login-container">
        <div class="login-box">
          <!-- Title -->
          <h2>Driver Login</h2>
          <p class="login-subtitle">Access your citation information</p>
          
          <!-- Error Message (hidden by default) -->
          <div id="error-message" class="alert alert-error" style="display: none;">
            <span id="error-text"></span>
          </div>
          
          <!-- Success Message (hidden by default) -->
          <div id="success-message" class="alert alert-success" style="display: none;">
            <span id="success-text"></span>
          </div>
          
          <!-- LOGIN FORM -->
          <form id="login-form">
            <!-- License Number Field -->
            <div class="form-group">
              <label for="license-number">License Number</label>
              <input 
                type="text" 
                id="license-number" 
                name="license_number"
                placeholder="e.g., D1234567" 
                required
              >
              <small class="error-hint" id="license-error"></small>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-block">
              <span id="btn-text">Login</span>
              <span id="btn-spinner" class="spinner" style="display: none;"></span>
            </button>
          </form>

          <!-- Links -->
          <div class="login-links">
            <p><a href="../index.html">Back to Home</a></p>
          </div>

          <!-- Demo Info -->
          <div class="demo-info">
            <h4>Demo Credentials:</h4>
            <p><strong>License:</strong> D1234567</p>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 New York Police Department. All rights reserved.</p>
      </div>
    </footer>

    <!-- JavaScript Files -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="driver-login.js"></script>

    </body>
</html>
